<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест по методичке фотографа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#F3F0EA; --card:#FFFFFF; --ink:#16161A; --muted:#6B6862; --line:#DDD7CC;
  --accent:#FF5A1F; --accent-ink:#FFFFFF;
  --good:#1C8F55; --good-bg:#E2F2E8; --bad:#D8342B; --bad-bg:#FBE7E3;
  --opt:#FFFFFF; --opt-hover:#FBF9F5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141416; --card:#1E1E22; --ink:#F2EFEA; --muted:#A09B93; --line:#34343A;
    --good:#4CC486; --good-bg:#16301F; --bad:#FF6B5E; --bad-bg:#3A1C19;
    --opt:#1E1E22; --opt-hover:#26262B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141416; --card:#1E1E22; --ink:#F2EFEA; --muted:#A09B93; --line:#34343A;
  --good:#4CC486; --good-bg:#16301F; --bad:#FF6B5E; --bad-bg:#3A1C19;
  --opt:#1E1E22; --opt-hover:#26262B;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:620px;margin:0 auto;padding-inline:18px;padding-block:22px 48px;display:flex;flex-direction:column;gap:18px}
.kicker{font-family:'Unbounded',system-ui,sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
h1,h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.12}
h2{font-size:21px;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:20px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{background:var(--card);border-radius:16px;padding:14px}
.fact b{display:block;font-family:'Unbounded',sans-serif;font-size:24px;font-variant-numeric:tabular-nums}
.fact span{font-size:13.5px;color:var(--muted)}
label.lbl{font-weight:700;font-size:15px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:8px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.btn{appearance:none;border:0;font:inherit;font-weight:800;font-size:17px;padding:16px 22px;border-radius:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.progress i{height:6px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--good)} .progress i.no{background:var(--bad)} .progress i.cur{background:var(--accent)}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qimg{border-radius:16px;overflow:hidden;background:#000}
.qimg img{display:block;width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--opt);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){background:var(--opt-hover);border-color:var(--muted)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)} .opt.right .l{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.explain{border-radius:16px;padding:16px 18px;font-size:16px}
.explain.ok{background:var(--good-bg)} .explain.no{background:var(--bad-bg)}
.explain b.v{display:block;font-family:'Unbounded',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.explain.ok b.v{color:var(--good)} .explain.no b.v{color:var(--bad)}
.explain .ref{margin-top:8px;font-size:14px;color:var(--muted)}
.score{font-family:'Unbounded',sans-serif;font-weight:800;font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:30px;color:var(--muted)}
.verdict{display:inline-block;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px}
.verdict.pass{background:var(--good-bg);color:var(--good)} .verdict.fail{background:var(--bad-bg);color:var(--bad)}
.mist{display:flex;flex-direction:column;gap:10px}
.mist .m{background:var(--card);border-radius:14px;padding:14px 16px;font-size:15.5px}
.mist .m b{display:block;margin-bottom:4px}
.mist .m .ref{color:var(--muted);font-size:13.5px;margin-top:4px}
pre.sum{white-space:pre-wrap;font:inherit;font-size:15px;background:var(--card);border-radius:14px;padding:14px 16px;margin:0;border:1.5px dashed var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:160px}
@media (prefers-reduced-motion:no-preference){ .fade{animation:f .25s ease-out} @keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }
textarea{width:100%;font:inherit;font-size:16.5px;line-height:1.45;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
textarea.fallback{margin-top:10px;min-height:120px}
.progress i.op{background:var(--accent)}
.mkwrap{position:relative}
.mk{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border:3px solid #FF2E1F;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.mk span{position:absolute;right:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:#FF2E1F;color:#fff;font-family:'Unbounded',sans-serif;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.explain.key{background:var(--card);border:1.5px solid var(--line)}
.explain.key b.v{color:var(--accent)}
.keylist{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.openans{white-space:pre-wrap;font-size:16px}
.cardimg{border-radius:18px;overflow:hidden;background:#141416;min-height:120px}
.cardimg img{display:block;width:100%;height:auto;-webkit-touch-callout:default}
</style>

</head>

{q:"Вы снимали на открытом пляже на f/4, 1/1000, ISO 100 и переходите с моделью в густую тень под пальмами. Что делаете первым делом?",
 o:["Делаю тестовый кадр, проверяю лицо и гистограмму, потом корректирую настройки","Сразу поднимаю ISO до 400 и продолжаю серию","Включаю Auto ISO, чтобы камера подстроилась сама","Снимаю на прежних настройках: полторы ступени ретушёр вытянет"],
 a:0, e:"Любая смена света — новый тестовый кадр. Поднять только ISO «на глаз» — угадывание, а Auto ISO заставит серию «скакать».", r:"стр. 8–9"},
{q:"Густая тень под деревьями, одна модель, статичный портрет. Какой набор настроек ближе всего к ориентиру из методички?",
 o:["f/8, 1/1000, ISO 100","f/2.8, 1/400, ISO 200–400","f/1.4, 1/60, ISO 100","f/5.6, 1/2000, ISO 3200"],
 a:1, e:"В тени нужно открыть диафрагму и чуть поднять ISO, но оставить выдержку короткой. 1/60 даст смаз, а f/5.6 при 1/2000 — лишний шум на ISO 3200.", r:"стр. 9"},
{q:"Яркое солнце, белый песок, невеста в белом платье. По какому признаку понять, что экспозиция верная?",
 o:["Лицо на экране камеры выглядит светлым и ярким","Гистограмма прижата к правому краю — в RAW так больше деталей","На платье не мигает индикатор пересветов, фактура ткани видна, а лицо не тёмное","Стрелка экспонометра стоит точно на нуле"],
 a:2, e:"Белое платье и песок пересвечиваются первыми. Ориентир — «мигалка» по белому и читаемое лицо, а не ноль экспонометра или яркая картинка на экране.", r:"стр. 7"},
{q:"Модель 10 минут стоит на одном месте, свет не меняется, а кадры серии получаются разной яркости. В чём вероятная причина и что делать?",
 o:["Нормальная ситуация: ретушёр выровняет серию пакетно","Работают автоматика и Auto ISO, которые реагируют на небо и белую одежду. Нужно перейти в режим M и зафиксировать настройки","Нужно после каждых 3–4 кадров вручную менять ISO","Виноват стабилизатор: его нужно выключить"],
 a:1, e:"При неизменном свете серия должна быть ровной. Автоматика «гуляет» от яркого неба и белой одежды в кадре — зафиксируйте настройки в режиме M.", r:"стр. 11"},
{img:"focus", q:"На этом кадре лицо ребёнка нерезкое, а резкость ушла на воду перед ним. Что поможет избежать такого промаха?",
 o:["Поднять ISO, чтобы камера фокусировалась увереннее","Удлинить выдержку, чтобы автофокус успевал навестись","Прикрыть диафрагму до f/2.8–4 и включить AF по глазам или одну точку на ближний глаз","Открыть диафрагму до f/1.4, чтобы автофокусу было светлее"],
 a:2, e:"Фокус должен быть на глазах. AF по глазам или одна точка плюс чуть прикрытая диафрагма дают запас резкости. ISO и выдержка на точность автофокуса не влияют, а f/1.4 только сузит зону резкости. Заметили промах — не продолжайте серию.", r:"стр. 13"},
{q:"Ребёнок бегает по кромке воды, кадры получаются смазанными. Какие настройки ближе к ориентиру?",
 o:["Выдержка 1/1000 и короче, непрерывный автофокус AF-C, при нехватке света — поднять ISO","Выдержка 1/250 и покадровый автофокус AF-S","Выдержка 1/125 и f/8, чтобы всё было в резкости","Включить стабилизатор и оставить выдержку 1/200"],

const PASS = 11, L = ["А","Б","В","Г"];
let S = {name:"", i:0, ans:[], order:[], open:""};
const AUTO = Q.filter(q=>q.type!=="open").length;

function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isOk = k => Q[k].type==="open" ? null : S.ans[k]===Q[k].a;

let DL = null;
try { window.claude?.use?.("downloads").then(d => { DL = d; }).catch(()=>{}); } catch(_) {}

function progress(){
  return '<div class="progress" aria-hidden="true">' + Q.map((q,k)=>{
    const a=S.ans[k]; let c = a==null ? (k===S.i?"cur":"") : (q.type==="open"?"op":(a===q.a?"ok":"no"));
    return `<i class="${c}"></i>`}).join("") + "</div>";
}

function start(){
  app.innerHTML = `
  <div class="kicker">Методичка фотографа</div>
  <h1>Тест: исходник без ошибок</h1>
  <p class="muted">Ситуации со съёмок и разборы реальных кадров. После каждого ответа — объяснение и ссылка на страницу методички. В конце — картинка с результатом, которую нужно отправить руководителю.</p>
  <div class="facts">
    <div class="fact"><b>15</b><span>вопросов</span></div>
    <div class="fact"><b>${PASS}/${AUTO}</b><span>чтобы сдать</span></div>
    <div class="fact"><b>~12</b><span>минут</span></div>
  </div>
  <div class="card">
    <label class="lbl" for="name">Ваше имя</label>
    <input type="text" id="name" placeholder="Например, Анна Смирнова" autocomplete="name">
  </div>
  <p class="muted" style="font-size:15px">Последний вопрос — разбор кадра своими словами, его проверяет руководитель. Цифры в вопросах — примерный ориентир для солнца и лёгкой облачности у моря.</p>
  <button class="btn" id="go" disabled>Начать тест</button>`;
  const n=document.getElementById("name"), go=document.getElementById("go");
  n.value=S.name; go.disabled=!n.value.trim();
  n.addEventListener("input",()=>{go.disabled=!n.value.trim()});
  n.addEventListener("keydown",e=>{if(e.key==="Enter"&&n.value.trim())go.click()});
  go.addEventListener("click",()=>{S.name=n.value.trim();S.i=0;S.ans=[];S.open="";S.order=Q.map(q=>q.o?shuffle(q.o.length):[]);question()});
}

function marksHTML(q){
  return q.marks.map((m,n)=>`<div class="mk" style="left:${m[0]*100}%;top:${m[1]*100}%;width:${m[2]}%"><span>${n+1}</span></div>`).join("");
}

function question(){
  const k=S.i, q=Q[k];
  if(q.type==="open") return openQuestion();
  const ord=S.order[k], done=S.ans[k]!=null;
  app.innerHTML = `
  ${progress()}
  <div class="qmeta"><span>Вопрос ${k+1} из ${Q.length}</span><span>${esc(S.name)}</span></div>
  <h2>${q.q}</h2>
  ${q.img?`<div class="qimg"><img src="${IMG[q.img]}" alt="Кадр к вопросу ${k+1}"></div>`:""}
  <div class="opts">${ord.map((oi,p)=>`<button class="opt" data-oi="${oi}"><span class="l">${L[p]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>
  <div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ if(S.ans[k]==null){S.ans[k]=+b.dataset.oi; reveal();} }));
  if(done) reveal();
  window.scrollTo({top:0});
}

function reveal(){
  const k=S.i,q=Q[k],a=S.ans[k],ok=a===q.a;
  app.querySelectorAll(".opt").forEach(b=>{
    const oi=+b.dataset.oi; b.disabled=true;
    if(oi===q.a) b.classList.add("right"); else if(oi===a) b.classList.add("wrong"); else b.classList.add("dim");
  });
  app.querySelector(".progress").outerHTML = progress();
  document.getElementById("fb").innerHTML = `
   <div class="explain ${ok?"ok":"no"} fade"><b class="v">${ok?"Верно":"Неверно"}</b>${q.e}<div class="ref">Методичка, ${q.r}</div></div>
   <div style="height:14px"></div>
   <button class="btn" id="next">Следующий вопрос</button>`;
  const nx=document.getElementById("next"); nx.focus({preventScroll:true});
  nx.addEventListener("click",()=>{ S.i++; question(); });
}

function openQuestion(){
  const k=S.i, q=Q[k], done=S.ans[k]!=null;
  app.innerHTML = `
  ${progress()}
  <div class="qmeta"><span>Вопрос ${k+1} из ${Q.length} · свой ответ</span><span>${esc(S.name)}</span></div>
  <h2>${q.q}</h2>
  <div class="qimg mkwrap"><img src="${IMG[q.img]}" alt="Кадр для разбора">${done?marksHTML(q):""}</div>
  <label class="lbl" for="open">Ваш разбор</label>
  <textarea id="open" rows="7" placeholder="Например: обрезаны…, на фоне…, свет…">${esc(S.open)}</textarea>
  <div class="qmeta"><span id="cnt"></span><span>Проверяет руководитель</span></div>
  <div id="fb"></div>`;
  const t=document.getElementById("open"), fb=document.getElementById("fb");
  const MIN=20;
  const upd=()=>{const n=t.value.trim().length;document.getElementById("cnt").textContent=n<MIN?`Минимум ${MIN} символов · сейчас ${n}`:`${n} символов`; const b=document.getElementById("send"); if(b) b.disabled=n<MIN;};
  if(done){ t.readOnly=true; showKey(q); }
  else { fb.innerHTML='<button class="btn" id="send" disabled>Ответить</button>';
    t.addEventListener("input",upd);
    document.getElementById("send").addEventListener("click",()=>{S.open=t.value.trim();S.ans[k]="open";openQuestion();}); }
  upd();
  if(!done) window.scrollTo({top:0});
}

function showKey(q){
  document.querySelector(".progress").outerHTML=progress();
  document.getElementById("fb").innerHTML=`
   <div class="explain key fade"><b class="v">Разбор по методичке</b>
   <ol class="keylist">${q.marks.map(m=>`<li>${m[3]}</li>`).join("")}</ol>
   <p style="margin-top:8px">${q.e}</p><div class="ref">Методичка, ${q.r}</div></div>
   <div style="height:14px"></div>
   <button class="btn" id="next">Показать результат</button>`;
  document.getElementById("next").addEventListener("click",result);
}

/* ---------- картинка с результатом ---------- */
function wrap(ctx, text, maxW){
  const out=[];
  text.split(/\n+/).forEach(par=>{
    let line="";
    par.split(/\s+/).forEach(w=>{
      const t=line?line+" "+w:w;
      if(ctx.measureText(t).width>maxW && line){out.push(line);line=w;} else line=t;
    });
    if(line) out.push(line);
  });
  return out;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

async function makeCard(score, pass, wrong, date){
  try{ await Promise.all([document.fonts.load('800 60px Unbounded','Тест'),document.fonts.load('700 30px Unbounded','Тест'),document.fonts.load('500 30px Manrope','Тест'),document.fonts.load('800 30px Manrope','Тест')]); }catch(_){}
  const W=1080, P=72, UN="Unbounded, 'Arial Black', sans-serif", MA="Manrope, Arial, sans-serif";
  const c=document.createElement("canvas"); const ctx=c.getContext("2d");
  ctx.font=`500 32px ${MA}`;
  let lines=wrap(ctx,S.open,W-P*2-56);
  const MAXL=16; if(lines.length>MAXL){lines=lines.slice(0,MAXL);lines[MAXL-1]+=" …";}
  const photo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=IMG.open;});
  const phH = photo ? Math.round((W-P*2)*photo.height/photo.width) : 0;
  const H = 110+70+90+60 + 200 + 150 + 70 + (wrong.length?60:0) + 40 + (phH?phH+40:0) + 70 + lines.length*46 + 60 + 40;
  c.width=W; c.height=H;
  ctx.fillStyle="#141416"; ctx.fillRect(0,0,W,H);
  let y=110;
  ctx.fillStyle="#FF5A1F"; ctx.beginPath(); ctx.arc(P+8,y-10,8,0,7); ctx.fill();
  ctx.font=`500 24px ${UN}`; ctx.fillText("МЕТОДИЧКА ФОТОГРАФА · ТЕСТ",P+30,y);
  y+=70; ctx.fillStyle="#fff"; ctx.font=`700 50px ${UN}`;
  let nm=S.name; while(ctx.measureText(nm).width>W-P*2 && nm.length>3) nm=nm.slice(0,-2);
  ctx.fillText(nm===S.name?nm:nm+"…",P,y);
  y+=60; ctx.fillStyle="#A09B93"; ctx.font=`500 30px ${MA}`; ctx.fillText(date,P,y);
  y+=60+170; ctx.fillStyle="#fff"; ctx.font=`800 190px ${UN}`; ctx.fillText(String(score),P-6,y);
  const sw=ctx.measureText(String(score)).width;
  ctx.fillStyle="#6f6b65"; ctx.font=`700 80px ${UN}`; ctx.fillText("/ "+AUTO,P+sw+18,y);
  // verdict pill
  ctx.font=`700 30px ${UN}`; const vt=pass?"ТЕСТ СДАН":"НЕ СДАН"; const vw=ctx.measureText(vt).width+56;
  ctx.fillStyle=pass?"#16301F":"#3A1C19"; rr(ctx,W-P-vw,y-120,vw,68,34); ctx.fill();
  ctx.fillStyle=pass?"#4CC486":"#FF6B5E"; ctx.fillText(vt,W-P-vw+28,y-75);
  // squares
  y+=60; const n=Q.length, gap=10, sq=(W-P*2-gap*(n-1))/n;
  Q.forEach((q,k)=>{ const ok=isOk(k); ctx.fillStyle= ok===null?"#FF5A1F":(ok?"#1C8F55":"#D8342B"); rr(ctx,P+k*(sq+gap),y,sq,sq,10); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font=`700 22px ${MA}`; const t=String(k+1); ctx.fillText(t,P+k*(sq+gap)+(sq-ctx.measureText(t).width)/2,y+sq/2+8); });
  y+=sq+60;
  ctx.font=`500 30px ${MA}`; ctx.fillStyle="#cfcac2";
  ctx.fillText(wrong.length?`Ошибки в вопросах: ${wrong.map(w=>w.k+1).join(", ")}`:"Все тестовые вопросы — без ошибок",P,y);
  y+=50;
  if(photo){ y+=20; ctx.save(); rr(ctx,P,y,W-P*2,phH,24); ctx.clip(); ctx.drawImage(photo,P,y,W-P*2,phH); ctx.restore(); y+=phH; }
  y+=70; ctx.fillStyle="#FF5A1F"; ctx.font=`700 26px ${UN}`; ctx.fillText(`ВОПРОС ${n} · ЧТО НЕ ТАК НА КАДРЕ`,P,y);
  y+=30; const bh=lines.length*46+50; ctx.fillStyle="#1E1E22"; rr(ctx,P,y,W-P*2,bh,24); ctx.fill();
  ctx.fillStyle="#F2EFEA"; ctx.font=`500 32px ${MA}`;
  lines.forEach((l,i)=>ctx.fillText(l,P+28,y+56+i*46));
  y+=bh+70; ctx.fillStyle="#6f6b65"; ctx.font=`500 24px ${MA}`; ctx.fillText("Вопрос "+n+" оценивает руководитель",P,y);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}

async function result(){
  const auto=Q.map((q,k)=>({q,k})).filter(({q})=>q.type!=="open");
  const score=auto.filter(({k})=>isOk(k)).length, pass=score>=PASS;
  const wrong=auto.filter(({k})=>!isOk(k));
  const date=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
  const sum=`Тест по методичке фотографа\n${S.name} — ${score}/${AUTO} (${pass?"сдан":"не сдан"}), ${date}` + (wrong.length?`\nОшибки в вопросах: ${wrong.map(w=>w.k+1).join(", ")}`:"") + `\n\nЧто не так на кадре (вопрос ${Q.length}):\n${S.open}`;
  app.innerHTML = `
  ${progress()}
  <div class="kicker">Результат</div>
  <div class="score">${score}<small> / ${AUTO}</small></div>
  <div><span class="verdict ${pass?"pass":"fail"}">${pass?"Тест сдан":"Тест не сдан"}</span></div>
  <p>${pass?"Хорошая работа. Сохраните картинку ниже и отправьте её руководителю.":`Чтобы сдать, нужно ${PASS} правильных ответов из ${AUTO}. Перечитайте страницы методички из списка ниже и пройдите тест ещё раз.`}</p>
  <h2>Ваш разбор кадра</h2>
  <div class="card openans">${esc(S.open)}</div>
  <h2>Картинка для руководителя</h2>
  <div class="cardimg" id="cardimg"><p class="muted" style="padding:20px">Собираем картинку…</p></div>
  <div class="row">
    <button class="btn" id="save" disabled>Сохранить и отправить</button>
    <button class="btn ghost" id="copy">Скопировать текстом</button>
  </div>
  <p class="muted" id="hint" style="font-size:14.5px">Если кнопка не сработала, нажмите на картинку и удерживайте — телефон предложит сохранить её или поделиться.</p>
  ${wrong.length?`<h2>Где ошибки</h2><div class="mist">${wrong.map(({q,k})=>`<div class="m"><b>${k+1}. ${q.q}</b>Правильно: ${q.o[q.a]}<div class="ref">Методичка, ${q.r}</div></div>`).join("")}</div>`:""}
  <button class="btn ghost" id="again">Пройти заново</button>`;
  window.scrollTo({top:0});
  document.getElementById("again").addEventListener("click",start);
  document.getElementById("copy").addEventListener("click",async e=>{
    const b=e.currentTarget;
    try{await navigator.clipboard.writeText(sum);b.textContent="Скопировано";}
    catch(_){const ta=document.createElement("textarea");ta.value=sum;ta.readOnly=true;ta.className="fallback";b.after(ta);ta.select();b.textContent="Текст выделен — скопируйте его";}
  });
  const blob=await makeCard(score,pass,wrong,date);
  const url=URL.createObjectURL(blob);
  document.getElementById("cardimg").innerHTML=`<img src="${url}" alt="Результат теста: ${esc(S.name)}, ${score} из ${AUTO}">`;
  const save=document.getElementById("save"), fname=`Тест фотографа — ${S.name.replace(/[\\/:*?"<>|]/g,"")}.png`;
  save.disabled=false;
  save.addEventListener("click",async()=>{
    const file=new File([blob],fname,{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:"Результат теста"}); return; }
      catch(err){ if(err&&err.name==="AbortError") return; }
    }
    if(DL){
      try{ await DL.save({filename:fname,data:blob}); save.textContent="Готово"; return; }
      catch(err){ if(err&&err.code==="declined") return; }
    }
    try{ const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); save.textContent="Картинка сохранена"; return; }catch(_){}
    try{ await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]); save.textContent="Картинка скопирована — вставьте её в чат"; return; }catch(_){}
    document.getElementById("hint").innerHTML="<b>Нажмите на картинку и удерживайте</b>, чтобы сохранить её или отправить.";
  });
}
start();
